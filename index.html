<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OS Drugs Chart — Clinic - B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(203, 213, 225, 0.75);
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --in-bg: #dcfce7;
      --in-text: #15803d;
      --in-border: #86efac;
      --low-bg: #fef9c3;
      --low-text: #a16207;
      --low-border: #fde047;
      --out-bg: #fee2e2;
      --out-text: #b91c1c;
      --out-border: #fca5a5;
      --na-bg: #f1f5f9;
      --na-text: #475569;
      --na-border: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 28px 18px;
      position: relative;
      background: linear-gradient(-45deg, #e0f2fe, #ccfbf1, #f0fdfa, #dbeafe, #ecfdf5);
      background-size: 350% 350%;
      animation: medicalPulseBg 16s ease infinite;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M28 22h4v6h6v4h-6v6h-4v-6h-6v-4h6v-6z' fill='%230d9488' fill-opacity='0.12'/%3E%3C/svg%3E");
    }

    @keyframes medicalPulseBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(153, 246, 228, 0.7);
      border-radius: 18px;
      padding: 22px 26px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px -10px rgba(13, 148, 136, 0.14);
      transition: all 0.3s ease;
    }

    header:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(240, 253, 250, 0.96));
      box-shadow: 0 16px 36px -10px rgba(13, 148, 136, 0.22);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .med-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0d9488, #0284c7);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #0f766e, #0369a1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .meta-stack {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .manual-date-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0fdfa;
      border: 1px solid #99f6e4;
      color: #0f766e;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .btn-refresh {
      background: linear-gradient(135deg, #0d9488, #0284c7);
      background-size: 200% auto;
      color: #fff;
      border: none;
      padding: 11px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.28);
      transition: all 0.3s ease;
    }

    .btn-refresh:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.38);
    }

    .controls {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(153, 246, 228, 0.7);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      box-shadow: 0 10px 25px -10px rgba(13, 148, 136, 0.12);
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 250px;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      width: 18px;
      height: 18px;
      color: var(--primary);
      pointer-events: none;
    }

    .search-wrapper input {
      width: 100%;
      padding: 13px 40px 13px 44px;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: #f8fafc;
      transition: all 0.28s ease;
    }

    .search-wrapper input:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.16);
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      background: #e2e8f0;
      color: #475569;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 13px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-btn:hover { background: #0d9488; color: #ffffff; }

    .controls select {
      padding: 13px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--text);
      background: #f8fafc;
      cursor: pointer;
    }

    .controls select:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.16);
    }

    .table-wrap {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(153, 246, 228, 0.7);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 34px -12px rgba(13, 148, 136, 0.15);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    th {
      background: linear-gradient(90deg, #f0fdfa, #e0f2fe);
      color: #0f766e;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      padding: 15px 18px;
      border-bottom: 1px solid rgba(153, 246, 228, 0.8);
    }

    td {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.65);
      transition: background 0.25s ease;
    }

    tbody tr.row-in:hover { background: linear-gradient(90deg, rgba(209, 250, 229, 0.75), rgba(240, 253, 250, 0.95)); }
    tbody tr.row-low:hover { background: linear-gradient(90deg, rgba(254, 249, 195, 0.8), rgba(255, 251, 235, 0.95)); }
    tbody tr.row-out:hover { background: linear-gradient(90deg, rgba(254, 226, 226, 0.75), rgba(255, 241, 242, 0.95)); }
    tbody tr.row-na:hover { background: linear-gradient(90deg, rgba(224, 242, 254, 0.75), rgba(248, 250, 252, 0.95)); }

    .drug-name { font-weight: 600; transition: padding 0.22s ease; }
    tbody tr:hover .drug-name { color: #0f766e; padding-left: 6px; }

    .letter-cell { width: 60px; text-align: center; }

    .letter-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, #ccfbf1, #bae6fd);
      color: #0f766e;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .badge.in-stock { background: var(--in-bg); color: var(--in-text); border-color: var(--in-border); }
    .badge.low-stock { background: var(--low-bg); color: var(--low-text); border-color: var(--low-border); }
    .badge.out-of-stock { background: var(--out-bg); color: var(--out-text); border-color: var(--out-border); }
    .badge.not-available { background: var(--na-bg); color: var(--na-text); border-color: var(--na-border); }

    .error-banner {
      display: none;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="title-row">
          <span class="med-badge">+</span>
          <h1>OS Drugs Chart — Clinic - B</h1>
        </div>
        <div class="meta-stack">
          <div class="meta">
            <span>📅 Sheet Manual Update Date (G3):</span>
            <span class="manual-date-pill" id="sheetManualDate">Reading from cell G3...</span>
          </div>
          <div class="meta">
            <span class="pulse-dot"></span>
            <span id="syncStatus">Current Live Sync: Checking Google Sheets...</span>
          </div>
          <div class="meta" id="nextCheckStatus">Auto-check: Twice daily (08:00 AM & 08:00 PM)</div>
        </div>
      </div>
      <div>
        <button class="btn-refresh" onclick="fetchSheetData()">↻ Refresh Now</button>
      </div>
    </header>

    <div class="error-banner" id="errorBanner"></div>

    <div class="controls">
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103.5 10.5a7.5 7.5 0 0013.15 6.15z" />
        </svg>
        <input type="text" id="searchInput" placeholder="Search medicine name (e.g., 1 Alpha, Metformin)..." oninput="handleSearchInput()" />
        <button class="clear-btn" id="clearSearchBtn" onclick="clearSearch()" title="Clear search">✕</button>
      </div>

      <select id="statusFilter" onchange="renderTable()">
        <option value="ALL">All Statuses</option>
        <option value="IN STOCK">In Stock</option>
        <option value="LOW STOCK">Low Stock</option>
        <option value="OUT OF STOCK">Out of Stock</option>
        <option value="NOT AVAILABLE">Not Available</option>
      </select>

      <select id="letterFilter" onchange="renderTable()">
        <option value="ALL">All Letters (A–Z)</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="text-align:center;">Index</th>
            <th>Drug Name</th>
            <th>Availability Status</th>
          </tr>
        </thead>
        <tbody id="drugsTableBody">
          <tr><td colspan="3" style="text-align:center; padding: 28px; color: var(--muted);">Loading live drug list...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SHEET_ID = "1ixGbE0KxdY1Snv7Qc-znuhzni1__WbMkkUMHAwIcuNg";
    const GID = "418430439";
    const CHECK_HOURS = [8, 20];

    let allDrugs = [];

    function readCellText(cell) {
      if (!cell) return "";
      if (cell.f !== undefined && cell.f !== null && String(cell.f).trim() !== "") {
        return String(cell.f).trim();
      }
      if (cell.v !== undefined && cell.v !== null) {
        const val = String(cell.v).trim();
        const dateMatch = val.match(/^Date\((\d+),(\d+),(\d+)/);
        if (dateMatch) {
          const y = Number(dateMatch[1]);
          const m = Number(dateMatch[2]);
          const d = Number(dateMatch[3]);
          return new Date(y, m, d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }
        return val;
      }
      return "";
    }

    function fetchSheetData() {
      const syncEl = document.getElementById("syncStatus");
      const manualDateEl = document.getElementById("sheetManualDate");
      const errEl = document.getElementById("errorBanner");
      syncEl.textContent = "Current Live Sync: Checking Google Sheet...";
      errEl.style.display = "none";

      const oldScript = document.getElementById("gsheet-jsonp");
      if (oldScript) oldScript.remove();

      window.handleSheetResponse = function(response) {
        if (!response || response.status === "error") {
          errEl.style.display = "block";
          errEl.textContent = "Could not load data. Make sure the Google Sheet is shared as 'Anyone with the link can view'.";
          syncEl.textContent = "Last check failed.";
          return;
        }

        const cols = response.table.cols || [];
        const rows = response.table.rows || [];
        const parsed = [];
        let currentLetter = "A";
        let manualDateVal = "";

        // Specifically target Cell G3 (Row index 1 in rows, Column index 6 in cells)
        if (rows.length >= 2) {
          const row3Cells = rows[1].c || []; // Row 3 is index 1 in rows array (Row 1 is headers, Row 2 is first drug, Row 3 is index 1)
          manualDateVal = readCellText(row3Cells[6]); // Column G is index 6
        }

        // Fallback check if G3 is empty
        if (!manualDateVal && rows.length > 0) {
          for (let r = 0; r < Math.min(rows.length, 3); r++) {
            const cells = rows[r].c || [];
            if (cells[6]) {
              manualDateVal = readCellText(cells[6]);
              if (manualDateVal) break;
            }
          }
        }

        manualDateEl.textContent = manualDateVal || "Not set in cell G3";

        // Failsafe if Row 2 merged into column labels
        if (cols[1] && cols[1].label) {
          const rawLabelB = String(cols[1].label).trim();
          const cleanedName = rawLabelB.replace(/^Drug Name\s*/i, "").trim();
          if (cleanedName) {
            const rawLabelC = cols[2] && cols[2].label ? String(cols[2].label).replace(/^In Stock\s*/i, "").trim() : "";
            parsed.push({
              letter: "A",
              showLetter: true,
              name: cleanedName,
              status: rawLabelC || "In Stock"
            });
          }
        }

        rows.forEach((r) => {
          const cells = r.c || [];
          const colA = readCellText(cells[0]);
          const drugName = readCellText(cells[1]);
          const rawStatus = readCellText(cells[2]);

          if (colA) currentLetter = colA.toUpperCase();
          if (!drugName || drugName.toLowerCase() === "drug name") return;

          const computedLetter = colA ? colA.toUpperCase() : (currentLetter || drugName.charAt(0).toUpperCase());

          parsed.push({
            letter: computedLetter,
            showLetter: Boolean(colA),
            name: drugName,
            status: rawStatus || "Not Available"
          });
        });

        allDrugs = parsed;
        populateLetterDropdown();
        renderTable();

        const now = new Date();
        syncEl.textContent = `Current Live Sync: ${now.toLocaleDateString()} at ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      };

      const script = document.createElement("script");
      script.id = "gsheet-jsonp";
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=1&tqx=responseHandler:handleSheetResponse&_=${Date.now()}`;
      script.onerror = function() {
        errEl.style.display = "block";
        errEl.textContent = "Network error or sheet is private. Please ensure Google Sheet sharing is set to 'Anyone with the link'.";
      };
      document.body.appendChild(script);
    }

    function populateLetterDropdown() {
      const select = document.getElementById("letterFilter");
      const existing = select.value;
      const letters = [...new Set(allDrugs.map(d => d.letter).filter(Boolean))].sort();
      select.innerHTML = `<option value="ALL">All Letters (A–Z)</option>` +
        letters.map(l => `<option value="${l}">${l}</option>`).join("");
      if (letters.includes(existing)) select.value = existing;
    }

    function getStatusStyles(status) {
      const s = status.toUpperCase();
      if (s.includes("IN STOCK")) return { badge: "in-stock", row: "row-in" };
      if (s.includes("LOW")) return { badge: "low-stock", row: "row-low" };
      if (s.includes("OUT")) return { badge: "out-of-stock", row: "row-out" };
      return { badge: "not-available", row: "row-na" };
    }

    function handleSearchInput() {
      const input = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      clearBtn.style.display = input.value.length > 0 ? "flex" : "none";
      renderTable();
    }

    function clearSearch() {
      const input = document.getElementById("searchInput");
      input.value = "";
      document.getElementById("clearSearchBtn").style.display = "none";
      input.focus();
      renderTable();
    }

    function renderTable() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const statusFilter = document.getElementById("statusFilter").value;
      const letterFilter = document.getElementById("letterFilter").value;
      const tbody = document.getElementById("drugsTableBody");

      const filtered = allDrugs.filter(d => {
        const matchesQuery = d.name.toLowerCase().includes(query);
        const matchesStatus = statusFilter === "ALL" || d.status.toUpperCase() === statusFilter;
        const matchesLetter = letterFilter === "ALL" || d.letter === letterFilter;
        return matchesQuery && matchesStatus && matchesLetter;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 32px; color: var(--muted);">No matching drugs found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((d, idx) => {
        const styles = getStatusStyles(d.status);
        const showPill = d.showLetter || idx === 0;
        return `
          <tr class="${styles.row}">
            <td class="letter-cell">${showPill && d.letter ? `<span class="letter-pill">${d.letter}</span>` : ""}</td>
            <td class="drug-name">${d.name}</td>
            <td><span class="badge ${styles.badge}">${d.status}</span></td>
          </tr>
        `;
      }).join("");
    }

    function scheduleTwiceDailyCheck() {
      const now = new Date();
      let nextRun = null;

      for (const hour of CHECK_HOURS) {
        const candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, 0, 0, 0);
        if (candidate > now) {
          nextRun = candidate;
          break;
        }
      }

      if (!nextRun) {
        nextRun = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, CHECK_HOURS[0], 0, 0, 0);
      }

      const msUntilNext = nextRun - now;
      document.getElementById("nextCheckStatus").textContent =
        `Auto-check: Twice daily (08:00 AM & 08:00 PM) • Next check at ${nextRun.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

      setTimeout(() => {
        fetchSheetData();
        scheduleTwiceDailyCheck();
      }, msUntilNext);
    }

    fetchSheetData();
    scheduleTwiceDailyCheck();
  </script>
</body>
</html>
